[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q
markers =
    requires_artifacts: needs local checkpoints/features/E2 rows (skipped on clean checkout)
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*httpx.*starlette.testclient.*:DeprecationWarning
    ignore:.*Using `httpx` with `starlette.testclient`.*:DeprecationWarning
    ignore::DeprecationWarning:starlette.testclient
    ignore::DeprecationWarning:fastapi.testclient
